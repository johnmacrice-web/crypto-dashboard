<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Crypto Dashboard</title>
    <style>
      :root { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; }
      body { margin: 0; background: #0b1020; color: #e9ecf1; }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
      .top { display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
      h1 { margin: 0; font-size: 22px; }
      .controls { display:flex; gap:10px; align-items:center; }
      button {
        border: 1px solid #2a3558; background:#121a33; color:#e9ecf1;
        padding:10px 12px; border-radius:12px; cursor:pointer;
      }
      button:disabled { opacity:0.6; cursor:not-allowed; }
      input {
        border: 1px solid #2a3558; background:#0e1530; color:#e9ecf1;
        padding:10px 12px; border-radius:12px; width: 260px;
      }
      .grid { display:grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap:12px; margin-top:16px; }
      .card { background:#0f1732; border:1px solid #1f2a4a; border-radius:16px; padding:14px; }
      .k { font-size:12px; opacity:.8; }
      .v { font-size:18px; font-weight:700; margin-top:6px; }
      .sub { font-size:12px; opacity:.75; margin-top:4px; }
      .tablewrap { margin-top: 14px; border:1px solid #1f2a4a; border-radius:16px; overflow:hidden; }
      table { width:100%; border-collapse:collapse; background:#0f1732; }
      th, td { padding: 12px; text-align:left; border-bottom: 1px solid #1f2a4a; font-size: 14px; }
      th { font-size: 12px; opacity:.8; background:#0c132b; }
      tr:hover td { background:#0e1736; }
      .pill { display:inline-block; padding:4px 8px; border-radius:999px; font-size:12px; border:1px solid #263158; }
      .pos { color: #48e29a; border-color:#1b5a43; }
      .neg { color: #ff6b7a; border-color:#6a1f2b; }
      .muted { opacity: .75; }
      @media (max-width: 900px){ .grid{grid-template-columns: repeat(2, minmax(0, 1fr));} }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="top">
        <h1>Crypto Dashboard</h1>
        <div class="controls">
          <input id="apiUrl" placeholder="Paste Worker base URL (workers.dev)" />
          <button id="saveBtn">Save</button>
          <button id="refreshBtn">Refresh</button>
        </div>
      </div>

      <div class="grid">
        <div class="card">
          <div class="k">BTC Price</div>
          <div class="v" id="btcPrice">—</div>
          <div class="sub" id="btcChange">—</div>
        </div>
        <div class="card">
          <div class="k">ETH Price</div>
          <div class="v" id="ethPrice">—</div>
          <div class="sub" id="ethChange">—</div>
        </div>
        <div class="card">
          <div class="k">Top Coins Avg 24h</div>
          <div class="v" id="avgChange">—</div>
          <div class="sub muted">mean % change</div>
        </div>
        <div class="card">
          <div class="k">Last Updated</div>
          <div class="v" id="lastUpdated">—</div>
          <div class="sub muted" id="status">Ready</div>
        </div>
        <div class="card">
          <div class="k">Market Regime (BTC)</div>
          <div class="v" id="regime">—</div>
          <div class="sub" id="regimeDetail">—</div>
</div>
      </div>

      <div class="tablewrap" style="margin-top:16px;">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Coin</th>
              <th>Price</th>
              <th>24h $ Volume</th>
              <th>24h %</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <p class="muted" style="margin-top:12px; font-size:12px;">
        Paste your Worker base URL like <span class="pill">https://crypto-api.YOURNAME.workers.dev</span>, click Save.
      </p>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);

      const fmtMoney = (n) =>
        new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(n);
function computeRegimeFromCandles(candles) {
  // candles rows: [time, low, high, open, close, volume]
  // Coinbase returns newest-first; we want oldest-first
  const rows = [...candles].reverse();

  // Use close prices
  const closes = rows.map(r => Number(r[4])).filter(n => Number.isFinite(n));
  if (closes.length < 20) return { label: "Not enough data", detail: "" };

  const first = closes[0];
  const last = closes[closes.length - 1];
  const pctMove = first ? ((last - first) / first) * 100 : 0;

  // Volatility proxy: average absolute % change between hourly closes
  let absSum = 0;
  for (let i = 1; i < closes.length; i++) {
    const prev = closes[i - 1];
    const cur = closes[i];
    if (prev) absSum += Math.abs((cur - prev) / prev) * 100;
  }
  const avgAbs = absSum / Math.max(1, closes.length - 1);

  // Simple labels (tweakable)
  const trend = pctMove >= 0 ? "Uptrend" : "Downtrend";
  const vol = avgAbs < 0.35 ? "Calm" : avgAbs < 0.8 ? "Normal" : "Wild";

  // Regime heuristic:
  // Uptrend + calm/normal => Risk-on
  // Downtrend + normal/wild => Risk-off
  let label = "Neutral";
  if (pctMove > 0.5 && (vol === "Calm" || vol === "Normal")) label = "Risk-on";
  if (pctMove < -0.5 && (vol === "Normal" || vol === "Wild")) label = "Risk-off";

  return {
    label,
    detail: `${trend} • Volatility: ${vol} • ~${pctMove.toFixed(2)}% (window)`,
  };
}

      const fmtCompactMoney = (n) =>
        new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD",
          notation: "compact",
          maximumFractionDigits: 2,
        }).format(n);

      function setStatus(msg) { $("status").textContent = msg; }

      function getBaseUrl() {
        return (localStorage.getItem("API_BASE") || "").replace(/\/+$/, "");
      }

      function setBaseUrl(v) {
        localStorage.setItem("API_BASE", v.replace(/\/+$/, ""));
      }

      async function load() {
        const base = getBaseUrl();
        if (!base) {
          setStatus("Paste your Worker URL, click Save.");
          return;
        }

        $("refreshBtn").disabled = true;
        setStatus("Loading…");

        try {
          const r = await fetch(base + "/api/markets");
          if (!r.ok) throw new Error("API error: " + r.status);
          try {
  const c = await fetch(base + "/api/candles?product=BTC-USD&granularity=3600");
  if (c.ok) {
    const payload = await c.json();
    const out = computeRegimeFromCandles(payload.candles || []);
    document.getElementById("regime").textContent = out.label;
    document.getElementById("regimeDetail").textContent = out.detail;
  } else {
    document.getElementById("regime").textContent = "—";
    document.getElementById("regimeDetail").textContent = "No candle data";
  }
} catch (e) {
  document.getElementById("regime").textContent = "—";
  document.getElementById("regimeDetail").textContent = "Error loading regime";
}
          const data = await r.json();

          const pill = (val) => {
            const cls = val >= 0 ? "pill pos" : "pill neg";
            const sign = val >= 0 ? "+" : "";
            return `<span class="${cls}">${sign}${val.toFixed(2)}%</span>`;
          };

          const btc = data.find((x) => x.symbol === "btc");
          const eth = data.find((x) => x.symbol === "eth");

          if (btc) {
            $("btcPrice").textContent = fmtMoney(btc.current_price);
            $("btcChange").innerHTML = pill(btc.price_change_percentage_24h ?? 0) + " (24h)";
          }
          if (eth) {
            $("ethPrice").textContent = fmtMoney(eth.current_price);
            $("ethChange").innerHTML = pill(eth.price_change_percentage_24h ?? 0) + " (24h)";
          }

          const changes = data.map((x) => x.price_change_percentage_24h ?? 0);
          const avg = changes.reduce((a,b)=>a+b,0) / Math.max(1, changes.length);
          $("avgChange").textContent = (avg >= 0 ? "+" : "") + avg.toFixed(2) + "%";

          const tbody = $("rows");
          tbody.innerHTML = "";
          data.forEach((x, i) => {
            const c = x.price_change_percentage_24h ?? 0;
            const row = document.createElement("tr");
            row.innerHTML = `
              <td class="muted">${i + 1}</td>
              <td><strong>${x.name}</strong> <span class="muted">(${x.symbol.toUpperCase()})</span></td>
              <td>${fmtMoney(x.current_price)}</td>
              <td>${fmtCompactMoney(x.market_cap || 0)}</td>
              <td>${pill(c)}</td>
            `;
            tbody.appendChild(row);
          });

          $("lastUpdated").textContent = new Date().toLocaleTimeString();
          setStatus("Live ✅");
        } catch (e) {
          console.error(e);
          setStatus("Error: " + e.message);
        } finally {
          $("refreshBtn").disabled = false;
        }
      }

      $("apiUrl").value = getBaseUrl();

      $("saveBtn").onclick = () => {
        const v = $("apiUrl").value.trim();
        if (!v) return;
        setBaseUrl(v);
        $("apiUrl").value = getBaseUrl();
        load();
      };

      $("refreshBtn").onclick = load;

      // Auto-refresh every 60s (matches Worker cache)
      setInterval(load, 60000);
      load();
    </script>
  </body>
</html>
